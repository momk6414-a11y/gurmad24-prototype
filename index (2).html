<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gurmad 24</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first column (max 880px) with sticky header, role-specific bottom nav, bottom sheets for forms.
   Identity: clinical teal-green with a coral emergency signal; clean white surfaces, soft shadows. */
:root{
  --bg:#EEF6F4; --surface:#FFFFFF; --surface-2:#F5FAF8; --ink:#0D2B2C; --muted:#5A7576; --line:#D9E8E5;
  --brand:#0B8F72; --brand-strong:#066A55; --brand-soft:#DAF2EA; --on-brand:#FFFFFF;
  --critical:#D2453B; --critical-soft:#FBE3E0; --warn:#A8690B; --warn-soft:#FBEFD6; --info:#235FA6; --info-soft:#DFEBF8;
  --hero-a:#0A3B3A; --hero-b:#0B6B5B; --hero-ink:#E8FBF5;
  --shadow:0 1px 2px rgba(10,50,48,.06),0 6px 18px rgba(10,50,48,.07);
  --map-h-land:#2F4A3A; --map-h-sea:#173B4A; --map-h-road:rgba(255,255,255,.34); --map-h-block:rgba(255,255,255,.07);
  --map-s-land:#5A5238; --map-s-sea:#1D4152; --map-s-road:rgba(255,235,200,.28); --map-s-block:rgba(0,0,0,.2);
  --map-t-land:#E9F0EA; --map-t-sea:#BAD8EB; --map-t-road:#FFFFFF; --map-t-block:#D5E2D6;
  --font-display:'Bricolage Grotesque','Inter',system-ui,sans-serif; --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1717; --surface:#102626; --surface-2:#142E2D; --ink:#E5F2EF; --muted:#8FABA8; --line:#1F3B3A;
  --brand:#2BC9A0; --brand-strong:#7FE3C6; --brand-soft:#123A33; --on-brand:#06201B;
  --critical:#FF7B70; --critical-soft:#3B1D1B; --warn:#E9B454; --warn-soft:#372D14; --info:#7DB4EA; --info-soft:#172B40;
  --hero-a:#0B2E2D; --hero-b:#0E5A4D; --hero-ink:#E8FBF5; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.28);
  --map-t-land:#22352F; --map-t-sea:#1B3A4B; --map-t-road:#3A524B; --map-t-block:#2B423A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1717; --surface:#102626; --surface-2:#142E2D; --ink:#E5F2EF; --muted:#8FABA8; --line:#1F3B3A;
  --brand:#2BC9A0; --brand-strong:#7FE3C6; --brand-soft:#123A33; --on-brand:#06201B;
  --critical:#FF7B70; --critical-soft:#3B1D1B; --warn:#E9B454; --warn-soft:#372D14; --info:#7DB4EA; --info-soft:#172B40;
  --hero-a:#0B2E2D; --hero-b:#0E5A4D; --hero-ink:#E8FBF5; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.28);
  --map-t-land:#22352F; --map-t-sea:#1B3A4B; --map-t-road:#3A524B; --map-t-block:#2B423A; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-body);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:42px;height:42px;flex:none}
.logo .l-bg{fill:var(--brand)} .logo .l-ring{fill:none;stroke:var(--on-brand);stroke-opacity:.4;stroke-width:2;stroke-dasharray:2 4} .logo .l-x{stroke:var(--on-brand);stroke-width:5;stroke-linecap:round}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--font-display);font-weight:700;letter-spacing:.1em;font-size:16px;white-space:nowrap}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;font-weight:600;background:var(--brand);color:var(--on-brand);text-align:center}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);min-height:40px;padding:0 14px;border-radius:999px}
.btn.soft{background:var(--brand-soft);color:var(--brand-strong)}
.btn.danger{background:var(--critical-soft);color:var(--critical)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:13.5px;border-radius:11px}

/* pilot banner */
.pilot{margin-top:14px;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:12.5px;line-height:1.45;text-align:center}
.pilot b{font-weight:700}
.main{padding-top:6px;padding-bottom:120px;display:flex;flex-direction:column;gap:18px}
.main>.pilot{margin-bottom:0}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;min-height:150px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);margin-top:14px;box-shadow:var(--shadow)}
.hero .grid-bg{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.2px);background-size:16px 16px;opacity:.7}
.ecg{position:absolute;left:0;bottom:30px;width:100%;height:80px}
.ecg path{fill:none;stroke:#6FF0C8;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:520;stroke-dashoffset:520;animation:ecg 3.6s ease-in-out infinite}
@keyframes ecg{0%{stroke-dashoffset:520}55%,100%{stroke-dashoffset:0}}
.hchip{position:absolute;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(2px)}
.hchip.a{left:42%;top:18px}.hchip.b{left:30%;top:62px}.hchip.c{left:56%;top:12px}
.ring{position:absolute;right:20px;top:50%;transform:translateY(-50%);width:96px;height:96px;border-radius:50%;border:2px solid #6FF0C8;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(111,240,200,.1)}
.ring .ic{width:42px;height:42px;stroke-width:1.6}
.hero-text{position:absolute;left:18px;top:18px;max-width:42%}
.hero-text small{display:block;opacity:.8;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.hero-text b{font-family:var(--font-display);font-size:20px;line-height:1.15;display:block;margin-top:4px}

.page-head h1{font-size:30px;line-height:1.1}
.page-head p{color:var(--muted);margin-top:4px}
.livebar{display:flex;align-items:center;gap:10px;color:var(--brand-strong);font-weight:600;font-size:14.5px;flex-wrap:wrap}
.livebar .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 0 var(--brand);animation:beat 2s infinite}
.livebar small{color:var(--muted);font-weight:500}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 55%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 16px;box-shadow:var(--shadow);min-width:0;transition:transform .15s,border-color .15s}
.stat:hover{border-color:var(--brand)}.stat:active{transform:scale(.98)}
.stat-top{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;min-height:40px}
.stat-top .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-strong);flex:none}
.stat-top .ico.crit{background:var(--critical-soft);color:var(--critical)}
.stat-top .ico.inf{background:var(--info-soft);color:var(--info)}
.stat-top .ico.wrn{background:var(--warn-soft);color:var(--warn)}
.stat-top span.l{flex:1;line-height:1.25;min-width:0}
.stat-top .go{width:16px;height:16px;opacity:.55}
.num{font-family:var(--font-display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.num small{font-size:22px;color:var(--muted);font-weight:600}

/* cards, rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.card-head h2,.card-head h3{min-width:0}
.card-head h2{font-size:19px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0;transition:border-color .15s}
button.row:hover{border-color:var(--brand)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--info-soft);color:var(--info)}
.chip.critical{background:var(--critical-soft);color:var(--critical)}.chip.high{background:var(--warn-soft);color:var(--warn)}.chip.medium{background:var(--info-soft);color:var(--info)}
.chip.brand{background:var(--brand-soft);color:var(--brand-strong)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);flex:none}
.pill.new,.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.dispatched,.pill.enroute,.pill.busy{background:var(--info-soft);color:var(--info)}
.pill.athospital,.pill.approved,.pill.available,.pill.paid,.pill.active{background:var(--brand-soft);color:var(--brand-strong)}
.pill.rejected,.pill.critical,.pill.expired{background:var(--critical-soft);color:var(--critical)}
.pill.high{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:22px 10px;border:1px dashed var(--line);border-radius:16px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.subhead{display:flex;align-items:center;gap:10px;margin-top:14px}
.subhead h1{font-size:24px}
.back{width:42px;height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.kv div{min-width:0}
.kv small{display:block;color:var(--muted);font-size:12.5px}
.kv b{font-weight:600;overflow-wrap:anywhere}
.org-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.org h3{font-size:17px}
.org .meta{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.org .meta div{display:flex;flex-direction:column;gap:5px}
.org .meta span{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.org .meta span b{color:var(--ink);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding-bottom:16px;position:relative;color:var(--muted)}
.tl li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .node{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.tl .node .ic{width:14px;height:14px;stroke-width:3;opacity:0}
.tl li.done{color:var(--ink)}.tl li.done .node{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}.tl li.done .node .ic{opacity:1}
.tl li.done::before{background:var(--brand)}
.tl li.cur .node{box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 25%,transparent)}
.tl li.cur b{color:var(--brand-strong)}
.tl time{font-variant-numeric:tabular-nums;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;min-height:46px;padding:0 14px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2)}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
select.input{appearance:auto}
.hint{font-size:13px;color:var(--muted)}

/* map */
.map{position:relative;aspect-ratio:400/260;border-radius:16px;overflow:hidden;border:1px solid var(--line);--z:1;background:var(--land)}
.map.hybrid{--land:var(--map-h-land);--sea:var(--map-h-sea);--road:var(--map-h-road);--block:var(--map-h-block)}
.map.sat{--land:var(--map-s-land);--sea:var(--map-s-sea);--road:var(--map-s-road);--block:var(--map-s-block)}
.map.street{--land:var(--map-t-land);--sea:var(--map-t-sea);--road:var(--map-t-road);--block:var(--map-t-block)}
.map-layer{position:absolute;inset:0;transform:scale(var(--z));transition:transform .25s;transform-origin:42% 52%}
.map-layer>svg{position:absolute;inset:0;width:100%;height:100%}
.m-land{fill:var(--land)}.m-sea{fill:var(--sea)}.m-blocks rect{fill:var(--block)}.m-roads{stroke:var(--road);fill:none;stroke-linecap:round}
.pin{position:absolute;transform:translate(-50%,-50%) scale(calc(1 / var(--z)));display:grid;place-items:center}
.pin.hp{width:28px;height:28px;border-radius:9px;background:var(--surface);color:var(--brand-strong);border:2px solid var(--brand);box-shadow:var(--shadow)}
.pin.hp .ic{width:15px;height:15px}
.pin.rp{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--brand);transition:left 4s linear,top 4s linear}
.pin.cp{width:16px;height:16px;border-radius:50%;border:2px solid #fff;background:var(--info)}
.pin.cp.critical{background:var(--critical)}.pin.cp.high{background:var(--warn)}
.pin.cp::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;opacity:0;animation:ping 2s infinite;color:inherit}
.pin.cp.critical::after{border-color:var(--critical)}.pin.cp.high::after{border-color:var(--warn)}.pin.cp.medium::after{border-color:var(--info)}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.map-ui{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.map-ui>*{pointer-events:auto}
.map-ui .seg{background:var(--surface);box-shadow:var(--shadow)}
.map-ui .seg button{padding:5px 10px;font-size:12.5px}
.zoom{display:flex;flex-direction:column;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;align-self:flex-start}
.zoom button{width:36px;height:34px;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--line)}
.map-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.map-legend span{display:inline-flex;align-items:center;gap:6px}
.map-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:880px;margin:0 auto;display:flex;gap:4px}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:14px;font-size:12px;font-weight:500;color:var(--muted);text-align:center}
.nav button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-strong);font-weight:600}

/* sheets, toast */
.scrim{position:fixed;inset:0;background:rgba(4,20,20,.55);z-index:40}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);max-height:90%;overflow:auto;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:rise .22s ease-out}
@keyframes rise{from{transform:translate(-50%,24px);opacity:0}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-head h2{font-size:21px}
.x{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:500;font-size:14px;max-width:min(92%,460px);text-align:center;box-shadow:var(--shadow)}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px;margin-bottom:14px}
.types button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px;text-align:center}
.types button[aria-pressed="true"]{border-color:var(--critical);background:var(--critical-soft);color:var(--critical)}

/* login */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.role h3{font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.role h3 .chip{width:38px;height:38px}

/* sos */
.sos{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:26px 16px}
.sos-btn{position:relative;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF8A7E,var(--critical) 62%);color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px color-mix(in srgb,var(--critical) 45%,transparent);text-align:center}
.sos-btn::before,.sos-btn::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--critical);animation:ping 2.6s infinite;opacity:0}
.sos-btn::after{animation-delay:1.3s}
.sos-btn .in{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--font-display);font-weight:700;font-size:18px}
.sos-btn .ic{width:44px;height:44px;stroke-width:1.7}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;text-align:center}
.hcard{border-radius:22px;padding:20px;color:#EFFFFA;background:linear-gradient(135deg,var(--hero-a),var(--hero-b) 70%,#12A483);position:relative;overflow:hidden;box-shadow:var(--shadow);min-height:190px;display:flex;flex-direction:column;justify-content:space-between}
.hcard::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(255,255,255,.08)}
.hcard .tier{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hcard .no{font-family:var(--font-display);font-size:22px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.hcard .who{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;font-size:13px}
.hcard .who b{display:block;font-size:16px}

@media(max-width:430px){.btn.ghost span{display:none}.btn.ghost{padding:0 12px}.page-head h1{font-size:26px}.hero-text{max-width:46%}.hchip.a{left:46%}.hchip.b{left:34%}.hchip.c{display:none}.ring{width:84px;height:84px;right:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ecg path{stroke-dashoffset:0}}

function caseDetail(id){
  const c=C.find(x=>x.id===id);if(!c)return '';
  const s=state.session,h=c.h&&hosp(c.h),r=c.r&&resp(c.r);
  const idx=ORDER.indexOf(c.status),next=ORDER[idx+1];
  const approvedH=H.filter(x=>x.status==='approved');
  let act='';
  if(c.status==='closed')act=`<p class="hint">${t('caseClosed')}</p>`;
  else if(s.role==='admin'){
    const rs=R.filter(x=>x.status==='available'||x.id===c.r);
    act=`<div class="field"><label for="selH">${t('assignHosp')}</label><select class="input" id="selH" data-change="assign-hospital" data-id="${c.id}"><option value="">${t('none')}</option>${approvedH.map(x=>`<option value="${x.id}" ${c.h===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="selR">${t('assignResp')}</label><select class="input" id="selR" data-change="assign-resp" data-id="${c.id}"><option value="">${t('none')}</option>${rs.map(x=>`<option value="${x.id}" ${c.r===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <button class="btn block" data-act="advance" data-id="${c.id}" ${next==='dispatched'&&!c.h?'disabled':''}>${t('moveTo')}${t('st_'+next)}</button>
      ${next==='dispatched'&&!c.h?`<p class="hint" style="margin-top:8px">${t('needHosp')}</p>`:''}`;
  } else if(s.role==='hospital'){
    if(!c.h)act=`<button class="btn block" data-act="accept" data-id="${c.id}">${I('check')}${t('accept')}</button>`;
    else if(c.h===s.hospitalId)act=`<button class="btn block" data-act="advance" data-id="${c.id}">${t('moveTo')}${t('st_'+next)}</button>`;
  }
  const tl=ORDER.map((st,i)=>{
    const ev=c.ev.find(e=>e.s===st);
    const cls=i<idx||(st==='closed'&&idx===4)?'done':i===idx?'done cur':'';
    return `<li class="${cls}"><span class="node">${I('check')}</span><b>${t('st_'+st)}</b><time>${ev?hm(ev.t):''}</time></li>`;
  }).join('');
  return `${subhead(c.id)}
  <div class="card"><div class="card-head" style="margin-bottom:14px"><div style="display:flex;gap:10px;align-items:center"><span class="chip ${c.pr}">${I(TI[c.type])}</span><div><h2>${t('ty_'+c.type)}</h2><small class="muted">${t('priority')}: ${t('pr_'+c.pr)}</small></div></div>${pill(c.status,t('st_'+c.status))}</div>
    <div class="kv"><div><small>${t('patient')}</small><b>${esc(c.patient)}</b></div><div><small>${t('phone')}</small><b>${esc(c.phone)}</b></div>
    <div><small>${t('location')}</small><b>${esc(c.loc)}</b></div><div><small>${t('created')}</small><b>${hm(c.created)}${isToday(c.created)?'':' · '+dstr(new Date(c.created))}</b></div>
    <div><small>${t('hospital')}</small><b>${h?esc(h.name):t('unassigned')}</b></div><div><small>${t('responder')}</small><b>${r?esc(r.name):t('unassigned')}</b></div></div></div>
  <div class="card">${mapHTML({cs:[c],hs:h?[h]:[],id:'mapc'})}${legend()}</div>
  <div class="card"><div class="card-head"><h2>${t('timeline')}</h2></div><ol class="tl">${tl}</ol></div>
  ${act?`<div class="card">${act}</div>`:''}`;
}

    <div class="field"><label for="rd">${t('district')}</label><select class="input" id="rd">${['Hodan','Waberi','Karaan','Bondhere','Yaaqshiid','Wadajir','Hawl-wadaag'].map(d=>`<option>${d}</option>`).join('')}</select></div>
    <div class="field"><label for="rp">${t('phone')}</label><input class="input" id="rp" inputmode="tel" value="+252 61 555 "></div>
    <div class="kv" style="margin-bottom:14px"><div class="field" style="margin:0"><label for="rb">${t('bedsTotal')}</label><input class="input" id="rb" type="number" min="0" value="20"></div><div class="field" style="margin:0"><label for="ra">${t('ambTotal')}</label><input class="input" id="ra" type="number" min="0" value="1"></div></div>
    <button class="btn block" data-act="reg-submit">${t('submitReg')}</button>`}
  return `<div class="scrim" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${title}</h2><button class="x" data-act="close-sheet" aria-label="${t('close')}">${I('x')}</button></div>${body}</div>`;
}

/* ---------- shell ---------- */
function navHTML(){
  const s=state.session;if(!s||state.nav.length)return '';
  const items=s.role==='admin'?[['overview','grid','overview'],['orgs','hospital','orgs'],['users','users','navUsers'],['cards','card','cards'],['finance','receipt','finance']]
   :s.role==='hospital'?[['overview','grid','overview'],['cases','alert','cases'],['resources','bed','resources'],['profile','user','profile']]
   :[['home','grid','tabHome'],['requests','alert','myRequests'],['hospitals','hospital','hospitals'],['card','card','healthCard']];
  return `<nav class="nav" aria-label="Main"><div class="nav-in">${items.map(([k,ic,l])=>`<button data-act="tab" data-t="${k}" ${state.tab===k?'aria-current="page"':''}>${I(ic)}<span>${t(l)}</span></button>`).join('')}</div></nav>`;
}
function headerHTML(){
  const s=state.session;
  return `<header class="top"><div class="wrap"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect class="l-bg" width="48" height="48" rx="14"/><circle class="l-ring" cx="24" cy="24" r="18"/><path class="l-x" d="M24 14v20M14 24h20"/></svg>
   <div class="brand"><b>GURMAD 24</b>${s?`<small>${t('roleTag_'+s.role)}${s.role==='hospital'?' · '+esc(hosp(s.hospitalId).name):''}</small>`:''}</div><div class="spacer"></div>
   <div class="seg" role="group" aria-label="${t('lang')}"><button data-act="lang" data-l="so" aria-pressed="${state.lang==='so'}">SO</button><button data-act="lang" data-l="en" aria-pressed="${state.lang==='en'}">EN</button></div>
   ${s?`<button class="btn ghost" data-act="logout" aria-label="${t('logout')}">${I('logout')}<span>${t('logout')}</span></button>`:''}</div></header>`;
}
function body(){
  const s=state.session;if(!s)return login();
  const top=state.nav[state.nav.length-1];
  if(top){
    if(top.v==='list')return subhead(t('caseList_'+top.b))+caseListBlock(top.b);
    if(top.v==='case')return caseDetail(top.id);
  }
  return s.role==='admin'?adminTabs():s.role==='hospital'?hospitalTabs():userTabs();
}
function render(keepScroll){
  const y=window.scrollY;
  $('#app').innerHTML=headerHTML()+`<main class="wrap main"><div class="pilot"><b>${t('pilotA')}</b>${t('pilotB')}</div>${body()}</main>`+navHTML()+sheetHTML();
  window.scrollTo(0,keepScroll?y:0);
}
function toast(msg){
  const h=$('#toast-host');h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast._t);toast._t=setTimeout(()=>{h.innerHTML=''},3200);
}

/* ---------- actions ---------- */
const ACT={
 lang(el){state.lang=el.dataset.l;try{localStorage.setItem('g24lang',state.lang)}catch(e){}render(true)},
 logout(){state.session=null;state.nav=[];state.sheet=null;state.tab='overview';render()},
 tab(el){state.tab=el.dataset.t;state.nav=[];state.chip='all';render()},
 'open-list'(el){state.nav.push({v:'list',b:el.dataset.b});state.chip='all';render()},
 'open-case'(el){state.nav.push({v:'case',id:el.dataset.id});state.sheet=null;render()},
 back(){state.nav.pop();state.chip='all';render()},
 chip(el){state.chip=el.dataset.s;render(true)},
 advance(el){const c=C.find(x=>x.id===el.dataset.id);if(c)advance(c);render(true)},
 accept(el){const c=C.find(x=>x.id===el.dataset.id);if(c&&state.session.hospitalId){c.h=state.session.hospitalId;advance(c)}render(true)},
 approve(el){hosp(el.dataset.id).status='approved';render(true)},
 reject(el){hosp(el.dataset.id).status='rejected';render(true)},
 step(el){const me=hosp(state.session.hospitalId),d=+el.dataset.d;
   if(el.dataset.k==='bed')me.bedsF=Math.max(0,Math.min(me.bedsT,me.bedsF+d));else me.ambF=Math.max(0,Math.min(me.ambT,me.ambF+d));render(true)},
 sheet(el){state.sheet=el.dataset.s;render(true)},
 'close-sheet'(){state.sheet=null;render(true)},
 'sos-type'(el){state.sosType=el.dataset.k;const v=$('#sloc')?.value||'';render(true);const n=$('#sloc');if(n)n.value=v},
 'sos-send'(){
   const me=user(state.session.userId),loc=($('#sloc').value||'').trim()||'Hodan',type=state.sosType,now=Date.now();
   caseSeq++;C.push({id:'G24-0'+caseSeq,type,pr:TPR[type],patient:me.name,phone:me.phone,loc,x:30+Math.round(Math.random()*30),y:35+Math.round(Math.random()*35),created:now,status:'new',h:null,r:null,u:me.id,ev:[{s:'new',t:now}]});
   state.sheet=null;render(true);toast(t('sent'));
 },
 renew(){
   const me=user(state.session.userId),k=K.find(x=>x.u===me.id);if(!k)return;
   const base=k.status==='active'?new Date(k.exp):new Date();base.setFullYear(base.getFullYear()+1);
   k.exp=dstr(base);k.status='active';T.push({id:'t'+(T.length+1),u:me.id,amt:k.tier==='basic'?2:k.tier==='plus'?5:9,m:'EVC Plus',s:'paid',ts:Date.now()});
   render(true);toast(t('renewed'));
 },
 'map-style'(el){
   state.mapStyle=el.dataset.m;const m=$('#map');if(m)m.className='map '+state.mapStyle;
   document.querySelectorAll('[data-act="map-style"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===state.mapStyle));
 },
 zoom(el){const m=$('#map');if(!m)return;let z=parseFloat(getComputedStyle(m).getPropertyValue('--z'))||1;z=Math.max(1,Math.min(2.4,z+(+el.dataset.d)*.4));m.style.setProperty('--z',z)},
 urole(el){state.uRole=el.dataset.r;render(true)},
 login(el){
   const r=el.dataset.r;
   if(r==='admin')state.session={role:'admin'};
   else if(r==='user')state.session={role:'user',userId:'u1'};
   else{
     const h=hosp($('#lh').value);
     if(h.status==='pending')return toast(t('regPending'));
     if(h.status==='rejected')return toast(t('regRejected'));
     state.session={role:'hospital',hospitalId:h.id};
   }
   state.tab=r==='user'?'home':'overview';state.nav=[];render();
 },
 'reg-submit'(){
   const n=($('#rn').value||'').trim();if(!n)return toast(t('needName'));
   const b=Math.max(0,parseInt($('#rb').value)||0),a=Math.max(0,parseInt($('#ra').value)||0);
   H.push({id:'h'+(H.length+1),name:n,district:$('#rd').value,bedsF:b,bedsT:b,ambF:a,ambT:a,status:'pending',x:20+Math.round(Math.random()*50),y:20+Math.round(Math.random()*55),phone:$('#rp').value,km:+(1+Math.random()*5).toFixed(1)});
   state.sheet=null;render();toast(t('regDone'));
 }
};
const CH={
 'assign-hospital'(el){const c=C.find(x=>x.id===el.dataset.id);c.h=el.value||null;render(true)},
 'assign-resp'(el){
   const c=C.find(x=>x.id===el.dataset.id);
   if(c.r&&c.status!=='new'){}
   const old=c.r&&resp(c.r);if(old&&c.status!=='closed')old.status='available';
   c.r=el.value||null;const nr=c.r&&resp(c.r);if(nr&&c.status!=='closed'&&c.status!=='new')nr.status='busy';
   render(true);
 }
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&CH[el.dataset.change])CH[el.dataset.change](el)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(el&&el.dataset.input==='uq'){state.uQ=el.value;const l=$('#ulist');if(l)l.innerHTML=usersList()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sheet){state.sheet=null;render(true)}});

/* live feel: refresh the stamp and drift responder markers */
setInterval(()=>{
  const s=$('#stamp');if(s)s.textContent=hms(Date.now());
  document.querySelectorAll('.pin.rp').forEach(p=>{
    const r=resp(p.dataset.r);if(!r||r.status!=='busy')return;
    r.x=Math.max(10,Math.min(70,r.x+(Math.random()-.5)*3));r.y=Math.max(15,Math.min(80,r.y+(Math.random()-.5)*3));
    p.style.left=r.x+'%';p.style.top=r.y+'%';
  });
},4000);

render();
</script>

</body>
</html>
